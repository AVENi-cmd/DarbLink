<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DarbLink Navigation</title>

  <!-- مكتبة الخرائط المتجهة MapLibre عالية الجودة -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #e5e3df; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* شريط البحث العلوي بنمط Google Maps */
    .search-pill-container {
      position: absolute;
      top: calc(env(safe-area-inset-top, 10px) + 10px);
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      background: #ffffff;
      height: 48px;
      border-radius: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .search-text {
      flex: 1;
      font-size: 0.95rem;
      color: #5f6368;
      font-weight: 500;
    }

    .road-badge {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* أزرار التحكم الطافية */
    .map-fab-column {
      position: absolute;
      right: 16px;
      bottom: 230px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3c4043;
      cursor: pointer;
    }

    .fab-btn.ptt {
      width: 62px;
      height: 62px;
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.45);
      position: relative;
    }

    .fab-btn.ptt.active {
      background: #dc2626;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.6);
      transform: scale(0.96);
    }

    /* الشريحة السفلية بنمط Google Maps */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
      z-index: 20;
      padding: 10px 16px calc(env(safe-area-inset-bottom, 15px) + 12px) 16px;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #dadce0;
      border-radius: 2px;
      margin: 4px auto 12px auto;
    }

    .driver-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .road-info h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #202124;
    }

    .road-info p {
      font-size: 0.8rem;
      color: #70757a;
      margin-top: 2px;
    }

    .live-chip {
      background: #e6f4ea;
      color: #137333;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot { width: 8px; height: 8px; background: #137333; border-radius: 50%; }

    /* بلاغ أمامك الأبرز */
    .ahead-alert-card {
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ahead-alert-card span { font-size: 0.85rem; color: #991b1b; font-weight: 600; }

    /* أزرار البلاغ السريع */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-incident {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #3c4043;
      cursor: pointer;
    }

    .btn-incident:active { background: #e8eaed; }
  </style>
</head>
<body>

  <!-- خريطة الملاحة الحقيقية المماثلة لجوجل ماب -->
  <div id="map"></div>

  <!-- الشريط العلوي الشبيه بجوجل ماب -->
  <div class="search-pill-container">
    <div class="search-box">
      <div class="profile-avatar">س</div>
      <div class="search-text">قناة الطريق اللحظية</div>
      <span class="road-badge" id="speedTag">0 كم/س</span>
    </div>
  </div>

  <!-- أزرار الملاحة والتحدث الطافية -->
  <div class="map-fab-column">
    <button class="fab-btn" onclick="recenterMap()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#5f6368"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <button class="fab-btn ptt" id="pttBtn">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <!-- الشريحة السفلية لمعلومات المسار والبلاغات -->
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="driver-status-row">
      <div class="road-info">
        <h2 id="roadTitle">طريق الملك فهد</h2>
        <p id="subStatus">الاتجاه شمال • المسار سالك</p>
      </div>
      <div class="live-chip">
        <span class="dot"></span>
        <span id="usersNearby">9 سائقين معك</span>
      </div>
    </div>

    <div class="ahead-alert-card">
      <span>⚠️ وش صاير قدام: حادث بالمسار الأيسر بعد 600م</span>
      <button onclick="playTrafficVoice()" style="background:none; border:none; font-size:1.1rem; cursor:pointer;">🔊</button>
    </div>

    <div class="quick-grid">
      <div class="btn-incident" onclick="reportAction('حادث')">💥 حادث</div>
      <div class="btn-incident" onclick="reportAction('ازدحام')">🛑 زحمة</div>
      <div class="btn-incident" onclick="reportAction('عائق')">🚧 خطر</div>
    </div>
  </div>

  <!-- سكريبت الخرائط عالية الدقة المتجهة من Carto / MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // خريطة بمواصفات Google Maps النظيفة مع زاوية ميلان واقعية للملاحة
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      center: [49.5833, 25.3833],
      zoom: 15.5,
      pitch: 45, // زاوية ميلان ثلاثية الأبعاد مثل سيارات الملاحة
      attributionControl: false
    });

    // مؤشر مسار السائق
    let userMarker = new maplibregl.Marker({ color: '#1a73e8' })
      .setLngLat([49.5833, 25.3833])
      .addTo(map);

    let currentCoords = [49.5833, 25.3833];

    // رسم مسار السير الأخضر الشبيه بجوجل ماب
    map.on('load', () => {
      map.addSource('route', {
        'type': 'geojson',
        'data': {
          'type': 'Feature',
          'geometry': {
            'type': 'LineString',
            'coordinates': [
              [49.5790, 25.3780],
              [49.5833, 25.3833],
              [49.5890, 25.3910]
            ]
          }
        }
      });
      map.addLayer({
        'id': 'route-line',
        'type': 'line',
        'source': 'route',
        'layout': { 'line-join': 'round', 'line-cap': 'round' },
        'paint': { 'line-color': '#00c853', 'line-width': 7, 'line-opacity': 0.85 }
      });
    });

    // تتبع الموقع الفعلي للسائق
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lng = pos.coords.longitude;
        const lat = pos.coords.latitude;
        currentCoords = [lng, lat];
        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('speedTag').innerText = `${speed} كم/س`;

        userMarker.setLngLat([lng, lat]);
        map.easeTo({ center: [lng, lat], zoom: 16 });
      }, null, { enableHighAccuracy: true });
    }

    function recenterMap() {
      map.flyTo({ center: currentCoords, zoom: 16, pitch: 45 });
    }

    // التحدث اللاسلكي PTT
    const pttBtn = document.getElementById('pttBtn');
    let rec;
    let chunks = [];

    navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
      rec = new MediaRecorder(stream);
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/mp4' });
        chunks = [];
        new Audio(URL.createObjectURL(blob)).play();
      };
    }).catch(() => console.log('Mic denied'));

    const startTalk = (e) => {
      e.preventDefault();
      if (rec && rec.state === 'inactive') {
        chunks = [];
        rec.start();
        pttBtn.classList.add('active');
        if (navigator.vibrate) navigator.vibrate(60);
      }
    };

    const stopTalk = (e) => {
      e.preventDefault();
      if (rec && rec.state === 'recording') {
        rec.stop();
        pttBtn.classList.remove('active');
      }
    };

    pttBtn.addEventListener('touchstart', startTalk);
    pttBtn.addEventListener('touchend', stopTalk);
    pttBtn.addEventListener('mousedown', startTalk);
    pttBtn.addEventListener('mouseup', stopTalk);

    function playTrafficVoice() {
      const msg = new SpeechSynthesisUtterance("تنبيه من السائقين أمامك: حادث سير بعد 600 متر في المسار الأيسر.");
      msg.lang = 'ar-SA';
      window.speechSynthesis.speak(msg);
    }

    function reportAction(title) {
      alert(`تم إرسال بلاغ: ${title} إلى السائقين في نفس مسارك`);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
  </script>
</body>
</html>
