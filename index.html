<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DarbLink | مسار السائق</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.85);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.5);
      --text: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; }
    
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* خلفية الخريطة الحية */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    /* واجهة القيادة الشفافة العلوية */
    .hud-overlay {
      position: relative;
      z-index: 2;
      padding: env(safe-area-inset-top, 20px) 16px 0 16px;
      pointer-events: none;
    }

    .top-panel {
      pointer-events: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .road-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #38bdf8;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .pulse {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulseAnim 1.5s infinite;
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .telemetry {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .telemetry span b { color: var(--text); }

    /* بطاقة التنبيه الأهم */
    .ahead-alert {
      margin-top: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-right: 4px solid var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* مركز التحكم السفلي */
    .bottom-panel {
      position: relative;
      z-index: 2;
      padding: 0 16px calc(env(safe-area-inset-bottom, 20px) + 16px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: none;
    }

    .ptt-container {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .ptt-button {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: radial-gradient(circle at 30% 30%, #0ea5e9, #0369a1);
      box-shadow: 0 0 35px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .ptt-button:active, .ptt-button.recording {
      background: radial-gradient(circle at 30% 30%, #ef4444, #b91c1c);
      box-shadow: 0 0 50px var(--danger-glow);
      transform: scale(0.94);
    }

    .ptt-button svg {
      width: 42px;
      height: 42px;
      fill: currentColor;
    }

    .ptt-button span {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* أزرار البلاغ السريع بنقرة واحدة */
    .action-grid {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .action-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 8px;
      border-radius: 14px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .action-card:active {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(0.97);
    }

    .action-card span.icon { font-size: 1.4rem; }
  </style>
</head>
<body>

  <!-- خريطة الملاحة الحية المظلمة -->
  <div id="map"></div>

  <!-- واجهة المعلومات العلوية -->
  <div class="hud-overlay">
    <div class="top-panel">
      <div class="status-row">
        <div class="road-title" id="roadName">طريق الملك فهد</div>
        <div class="live-badge">
          <div class="pulse"></div>
          <span id="driversCount">14 سائق متصل</span>
        </div>
      </div>
      <div class="telemetry">
        <span>السرعة: <b id="speedVal">0</b> كم/س</span>
        <span>الاتجاه: <b id="headingVal">شمال</b></span>
        <span>المسار: <b style="color: #38bdf8;">سالك</b></span>
      </div>
      <div class="ahead-alert" id="aheadBox">
        <span>⚠️ <b>وش صاير قدام:</b> حركة سير طبيعية</span>
        <small style="color: var(--text-muted);">محدث الآن</small>
      </div>
    </div>
  </div>

  <!-- واجهة التحكم والتحدث السفلية -->
  <div class="bottom-panel">
    <div class="ptt-container">
      <button class="ptt-button" id="pttBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span id="pttText">اضغط وتحدث</span>
      </button>
    </div>

    <div class="action-grid">
      <div class="action-card" onclick="postIncident('حادث أمامي')">
        <span class="icon">💥</span>
        <span>حادث</span>
      </div>
      <div class="action-card" onclick="postIncident('ازدحام شديد')">
        <span class="icon">🛑</span>
        <span>زحمة</span>
      </div>
      <div class="action-card" onclick="postIncident('عائق / تحويلة')">
        <span class="icon">🚧</span>
        <span>عائق</span>
      </div>
    </div>
  </div>

  <!-- سكربت الخرائط والصوت الحقيقي -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // إعداد الخريطة في وضع الليل المظلم
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([24.7136, 46.6753], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    let userMarker = L.circleMarker([24.7136, 46.6753], {
      radius: 9,
      fillColor: '#38bdf8',
      color: '#ffffff',
      weight: 3,
      fillOpacity: 1
    }).addTo(map);

    // تتبع الحركة المباشرة بدقة عبر GPS الهاتف
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        
        document.getElementById('speedVal').innerText = speed;
        userMarker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);

        if (pos.coords.heading) {
          const h = pos.coords.heading;
          let dirText = 'شمال';
          if (h > 45 && h <= 135) dirText = 'شرق';
          else if (h > 135 && h <= 225) dirText = 'جنوب';
          else if (h > 225 && h <= 315) dirText = 'غرب';
          document.getElementById('headingVal').innerText = dirText;
        }
      }, (err) => console.log(err), { enableHighAccuracy: true });
    }

    // إدارة تسجيل وبث الصوت PTT
    const pttBtn = document.getElementById('pttBtn');
    const pttText = document.getElementById('pttText');
    let recorder;
    let chunks = [];

    navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/mp4' });
        chunks = [];
        const audio = new Audio(URL.createObjectURL(blob));
        audio.play(); // تشغيل فوري للتجربة الذاتية
      };
    }).catch(e => console.log('Mic restricted'));

    const startTalk = (e) => {
      e.preventDefault();
      if (recorder && recorder.state === 'inactive') {
        chunks = [];
        recorder.start();
        pttBtn.classList.add('recording');
        pttText.innerText = 'بث حي...';
        if (navigator.vibrate) navigator.vibrate(60);
      }
    };

    const stopTalk = (e) => {
      e.preventDefault();
      if (recorder && recorder.state === 'recording') {
        recorder.stop();
        pttBtn.classList.remove('recording');
        pttText.innerText = 'اضغط وتحدث';
      }
    };

    pttBtn.addEventListener('touchstart', startTalk);
    pttBtn.addEventListener('touchend', stopTalk);
    pttBtn.addEventListener('mousedown', startTalk);
    pttBtn.addEventListener('mouseup', stopTalk);

    function postIncident(type) {
      document.getElementById('aheadBox').innerHTML = `<span>🚨 <b>تنبيه من السائقين:</b> ${type} بعد 600م</span>`;
      if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
    }
  </script>
</body>
</html>
